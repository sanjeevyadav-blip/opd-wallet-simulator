<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corporate OPD Wallet Simulator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky input rail on the left, P&L ledger and tests on the right; stacks on phones. */
:root{
  --bg:#F1F3F0; --surface:#FFFFFF; --surface2:#F6F8F5; --line:#D5DBD3; --line2:#E6EAE3;
  --ink:#14201B; --soft:#4F5F57; --faint:#7F8F86;
  --accent:#0F6B5C; --accent-ink:#FFFFFF; --accent-soft:#DFEEE9;
  --amber:#9A5B00; --amber-soft:#FBEBD0;
  --pos:#1F7A43; --pos-soft:#E1F2E7; --neg:#B3321F; --neg-soft:#FAE5E0;
  --display:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1411; --surface:#121C18; --surface2:#17231E; --line:#26362F; --line2:#1D2B25;
  --ink:#E6EEEA; --soft:#A2B4AB; --faint:#72857B;
  --accent:#46B8A3; --accent-ink:#06211B; --accent-soft:#143A32;
  --amber:#E2A545; --amber-soft:#33260E; --pos:#55C282; --pos-soft:#133423; --neg:#EE7C68; --neg-soft:#3A1D16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1411; --surface:#121C18; --surface2:#17231E; --line:#26362F; --line2:#1D2B25;
  --ink:#E6EEEA; --soft:#A2B4AB; --faint:#72857B;
  --accent:#46B8A3; --accent-ink:#06211B; --accent-soft:#143A32;
  --amber:#E2A545; --amber-soft:#33260E; --pos:#55C282; --pos-soft:#133423; --neg:#EE7C68; --neg-soft:#3A1D16; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--display);margin:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;-webkit-font-smoothing:antialiased}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;max-width:1400px;margin:0 auto}
h1{font-size:19px;margin:0;letter-spacing:-.01em}
.btn{font:600 12.5px var(--display);border:1px solid var(--line);background:var(--surface);color:var(--soft);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn:hover{color:var(--ink);border-color:var(--faint)}
.tabs{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.tabs button{font:600 12.5px var(--display);border:0;background:transparent;color:var(--soft);padding:7px 13px;border-radius:7px;cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:18px;max-width:1400px;margin:18px auto 0;align-items:start}
@media(max-width:940px){.layout{grid-template-columns:1fr}.rail{position:static!important;max-height:none!important}}
.rail{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.grp{padding:14px 16px;border-bottom:1px solid var(--line2)}.grp:last-child{border:0}
.grp>.eyebrow{display:block;margin-bottom:10px}
.f{margin-bottom:12px}.f:last-child{margin-bottom:0}
.fl{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:600;margin-bottom:4px}
.fl small{font-weight:400;color:var(--faint);font-size:11px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.in{display:flex;align-items:center;gap:6px}
.in input[type=number]{width:100%;min-width:0;font:12.8px var(--mono);background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;color:var(--ink)}
.in .u{font-size:11.5px;color:var(--faint);white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:3px;background:var(--line);margin:8px 0 0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--accent)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
select{font:12.8px var(--display);background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:11.5px;color:var(--soft);background:var(--surface2);border:1px dashed var(--line);border-radius:7px;padding:6px 8px;margin-top:6px}
.note.warn{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.kpi .v{font:600 20px var(--mono)}.kpi .s{font-size:11.5px;color:var(--soft)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.ch{padding:13px 16px;border-bottom:1px solid var(--line2)}
.ch h2{margin:0;font-size:15px}.ch p{margin:2px 0 0;color:var(--soft);font-size:12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 16px;font-size:13px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-weight:700;background:var(--surface2);font-size:12px}
td.l{color:var(--soft)}
tr.sub td{font-weight:600;background:var(--surface2)}
tr.net td{font-weight:700;font-size:14px;border-top:2px solid var(--line);background:var(--surface2)}
td.m,th.m{font-family:var(--mono);font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.pad{padding:14px 16px}
.pad p{margin:0 0 8px;color:var(--soft);font-size:13px;max-width:70ch}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px}
.chip.g{background:var(--pos-soft);color:var(--pos)}.chip.r{background:var(--neg-soft);color:var(--neg)}.chip.a{background:var(--amber-soft);color:var(--amber)}
svg text{fill:var(--soft);font:11px var(--mono)}
.tcell{white-space:normal!important;text-align:left!important;min-width:150px;font-size:12.5px;color:var(--soft)}
.tcell b{color:var(--ink)}
</style>

</head>
<body>
<header>
  <div><span class="eyebrow">Corporate health benefits</span><h1>Corporate OPD Wallet Simulator</h1></div>
  <button class="btn" onclick="resetAll()">Reset to defaults</button>
</header>

<div class="layout" id="v-sim">
<aside class="rail" id="rail"></aside>
<main class="main" id="out"></main>
</div>

<div class="layout" id="v-types" hidden style="grid-template-columns:minmax(0,1fr)">
<main class="main" id="types"></main>
</div>

<script>
const DEF={F:10000,P:5000,incl:0,gst:0,N:1000,
 lp:3000,ld:3000,lc:3000,la:1000,
 up:60,ud:60,uc:60,ua:50,
 gp:0,gd:0,gc:0,ga:0,
 mp:22,md:18,dsP:0,dsD:0,mc:30,ma:45,basis:'ex',
 gpMode:'paid',gpUnl:4,gpWorst:12,gpPrice:500,gpCost:40,spPrice:800,spCost:250,spMode:'top',spUsed:3,spCap:10,virt:3,
 plat:150,dist:8,target:10,vPrice:300,s1:40,s2:60,s3:80,s4:100,worstVirt:24,parF:5000};
let S={...DEF};
const FIELDS=[
 ['Wallet &amp; price',[
  ['F','Wallet face value','₹',1000,30000,500,'Value the member can spend'],
  ['P','Customer pays','₹',1000,30000,250,'Price of the wallet'],
  ['N','Wallets sold','',100,50000,100,'Employees enrolled']]],
 ['Bucket limits (₹ of face value)',[
  ['lp','Pharma','₹',0,10000,250,''],['ld','Diagnostics','₹',0,10000,250,''],
  ['lc','Physical consult','₹',0,10000,250,''],['la','AHC package','₹',0,5000,250,'']]],
 ['Expected utilisation (% of each limit)',[
  ['up','Pharma','%',0,150,1,''],['ud','Diagnostics','%',0,150,1,''],
  ['uc','Physical consult','%',0,150,1,''],['ua','AHC package','%',0,150,1,'']]],
 ['Margins (your numbers)',[
  ['mp','Pharma margin','%',0,60,0.5,'Illustrative'],['md','Diagnostics margin','%',0,60,0.5,'Illustrative'],
  ['mc','GP consult margin (physical)','%',0,80,0.5,'Assumption, set yours'],
  ['dsP','Pharma discount to member','%',0,90,0.5,'Off list price; assumption'],['dsD','Diagnostics discount to member','%',0,90,0.5,'Off list price; assumption'],
  ['ma','AHC margin','%',0,70,0.5,'Assumption, not given'],
  ['gpCost','Virtual consult cost to the provider','₹',0,500,5,'Illustrative'],['spCost','Speciality consult cost','₹',0,1500,10,'Illustrative']]],
 ['Consult mechanics',[
  ['vPrice','Value of one virtual consult (for perceived value)','₹',0,2000,50,'Assumption'],
  ['gpPrice','List value of one physical GP consult','₹',100,2000,50,'Assumption; debit in paid GP'],
  ['spPrice','Debit per speciality consult','₹',200,4000,50,'Assumption'],
  ['spCap','Speciality consults promised','#',0,20,1,''],
  ['spUsed','Speciality consults used per wallet','#',0,20,0.5,''],
  ['virt','Virtual consults used per wallet','#',0,24,1,'Unlimited in the brief'],
  ['gpUnl','GP visits used per wallet','#',0,24,1,'Unlimited GP model only'],
  ['gpWorst','Worst case: GP visits per wallet','#',0,60,1,'Unlimited GP, fair-use ceiling']]],
 ['Scenarios and tests',[
  ['s1','Scenario 1 utilisation','%',0,200,5,''],['s2','Scenario 2 utilisation','%',0,200,5,''],['s3','Scenario 3 utilisation','%',0,200,5,''],['s4','Scenario 4 utilisation','%',0,200,5,''],
  ['worstVirt','Worst case: virtual consults per wallet','#',0,60,1,'Fair-use ceiling'],
  ['parF','Par wallet face value (design B)','₹',1000,30000,250,'Product types tab']]],
 ['Commercial',[
  ['plat','Platform and servicing cost per wallet','₹',0,1000,10,'Assumption'],
  ['dist','Distribution / channel cost','%',0,30,0.5,'% of net price, assumption'],
  ['target','Target contribution margin','%',0,60,1,'']]]
];
const $=id=>document.getElementById(id);
function buildRail(){
 let h='<div class="grp"><span class="eyebrow">Inputs</span><div class="note">Every field recalculates the P&amp;L. Fields marked as assumptions are not from your brief.</div></div>';
 for(const [t,fs] of FIELDS){
  h+=`<div class="grp"><span class="eyebrow">${t}</span>`;
  if(t.startsWith('Consult'))h+=`<div class="f"><div class="fl">Physical GP consult model</div><select id="gpMode"><option value="paid">Paid GP: debited from the wallet, GP margin earned</option><option value="unl">Unlimited GP: free visits, cost at GP margin</option></select><div class="note">Unlimited GP removes the physical consult bucket from the wallet and prices each visit at the list value less GP margin.</div></div>`;
  for(const [k,l,u,mn,mx,st,nt] of fs){
   h+=`<div class="f"><div class="fl"><span>${l}</span><small>${nt}</small></div><div class="in">${u==='₹'?'<span class="u">₹</span>':''}<input type="number" id="n_${k}" step="${st}">${u==='%'?'<span class="u">%</span>':''}</div><input type="range" id="r_${k}" min="${mn}" max="${mx}" step="${st}"></div>`;}
  if(t.startsWith('Consult')){
   h+=`<div class="f"><div class="fl">Speciality consults sit</div><select id="spMode"><option value="top">On top of the bucket (free benefit)</option><option value="in">Inside the physical consult bucket</option></select></div>`;}
  h+='</div>';
 }
 $('rail').innerHTML=h;
 for(const [,fs] of FIELDS)for(const [k] of fs){
  const n=$('n_'+k),r=$('r_'+k);
  const set=v=>{S[k]=+v;n.value=v;r.value=v;draw()};
  n.addEventListener('input',()=>{if(n.value!=='')set(n.value)});
  r.addEventListener('input',()=>set(r.value));
 }
 $('spMode').addEventListener('change',e=>{S.spMode=e.target.value;draw()});
 $('gpMode').addEventListener('change',e=>{S.gpMode=e.target.value;draw()});
 syncRail();
}
function syncRail(){
 for(const [,fs] of FIELDS)for(const [k] of fs){$('n_'+k).value=S[k];$('r_'+k).value=S[k]}
 $('spMode').value=S.spMode;$('gpMode').value=S.gpMode;
}
function resetAll(){S={...DEF};syncRail();draw()}

/* ---------- formatting ---------- */
const IN=n=>Math.abs(n).toLocaleString('en-IN',{maximumFractionDigits:0});
const inr=(n,dp=0)=>(n<0?'−':'')+'₹'+Math.abs(n).toLocaleString('en-IN',{minimumFractionDigits:dp,maximumFractionDigits:dp});
function big(n){const a=Math.abs(n),s=n<0?'−':'';
 if(a>=1e7)return s+'₹'+(a/1e7).toFixed(2)+' crore';
 if(a>=1e5)return s+'₹'+(a/1e5).toFixed(2)+' lakh';
 return inr(n)}
const pc=(n,d=1)=>(n*100).toFixed(d)+'%';
const cl=n=>n>=0?'pos':'neg';

/* ---------- model ---------- */
function calc(s,uOverride){
 const g=s.gst/100;
 const net=s.incl?s.P/(1+g):s.P;
 const gross=s.incl?s.P:s.P*(1+g);
 const u=uOverride==null?{p:s.up/100,d:s.ud/100,c:s.uc/100,a:s.ua/100}:{p:uOverride,d:uOverride,c:uOverride,a:uOverride};
 const unl=s.gpMode==='unl',spm=unl?'top':s.spMode,faceEff=unl?Math.max(0,s.F-s.lc):s.F;
 const spP=s.lp*u.p,spD=s.ld*u.d,spC=unl?0:s.lc*u.c,spA=s.la*u.a;
 const gpT=s.gp/100,gdT=s.gd/100;
 const salesP=spP/(1+gpT),salesD=spD/(1+gdT),salesC=spC/(1+s.gc/100),salesA=spA/(1+s.ga/100);
 const costP=(s.basis==='ex'?salesP:spP)*(1-s.mp/100)/(1-s.dsP/100);
 const costD=(s.basis==='ex'?salesD:spD)*(1-s.md/100)/(1-s.dsD/100);
 const costA=s.basis==='ex'?salesA*(1-s.ma/100):spA*(1-s.ma/100);
 let spUsed=Math.min(s.spUsed,s.spCap),gpVisits,spDebit=0;
 if(spm==='in'){spUsed=Math.min(spUsed,spC/s.spPrice);spDebit=spUsed*s.spPrice;gpVisits=Math.max(0,spC-spDebit)/s.gpPrice}
 else gpVisits=unl?s.gpUnl:spC/s.gpPrice;
 const spCg=spm==='in'?Math.max(0,spC-spDebit):spC;
 const salesCg=spCg/(1+s.gc/100);
 const unitGP=s.basis==='ex'?s.gpPrice/(1+s.gc/100):s.gpPrice;
 const costC=unl?gpVisits*unitGP*(1-s.mc/100):(s.basis==='ex'?salesCg:spCg)*(1-s.mc/100);
 const costV=s.virt*s.gpCost;
 const costS=spUsed*s.spCost;
 const cogs=costP+costD+costC+costA+costV+costS;
 const gm=net-cogs;
 const dist=net*s.dist/100;
 const contrib=gm-s.plat-dist;
 const spend=spP+spD+spC+spA;
 const perceived=spP/(1-s.dsP/100)+spD/(1-s.dsD/100)+spC+spA+s.virt*s.vPrice+(unl?gpVisits*s.gpPrice:0)+(spm==='top'?spUsed*s.spPrice:0);
 const retail=(salesP-costP)+(salesD-costD)+(salesC-costC)+(salesA-costA);
 return {unl,faceEff,spUsedDebit:spDebit,salesC,salesA,net,gross,spP,spD,spC,spA,costP,costD,costC,costA,costV,costS,cogs,gm,dist,contrib,spend,perceived,gpVisits,spUsed,retail,salesP,salesD,cm:contrib/net};
}
function breakeven(s){
 const f=u=>calc(s,u).contrib;
 if(f(0)<0)return 0;
 if(f(3)>0)return null;
 let a=0,b=3;for(let i=0;i<60;i++){const m=(a+b)/2;f(m)>0?a=m:b=m}return (a+b)/2;
}
function worst(s){
 const w={...s,virt:s.worstVirt,spUsed:s.spCap,gpUnl:s.gpWorst};
 return calc(w,1);
}

/* ---------- render ---------- */
function row(l,v,cls=''){return `<tr class="${cls}"><td class="${cls?'':'l'}">${l}</td><td class="m">${inr(v,0)}</td><td class="m">${big(v*S.N)}</td></tr>`}
function chart(s){
 const W=560,H=210,L=52,R=14,T=14,B=30,pts=[];
 for(let i=0;i<=12;i++){const u=i/10;pts.push([u,calc(s,u).contrib])}
 const ys=pts.map(p=>p[1]),mn=Math.min(...ys,0),mx=Math.max(...ys,0);
 const pad=(mx-mn)*0.08||100,y0=mn-pad,y1=mx+pad;
 const X=u=>L+u/1.2*(W-L-R),Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
 let d='M'+pts.map(p=>X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' L');
 const cur=(s.up+s.ud+s.uc+s.ua)/400;
 const be=breakeven(s);
 let g='';
 for(let i=0;i<=6;i++){const v=y0+(y1-y0)*i/6;g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line2)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${IN(v)}</text>`}
 for(let i=0;i<=12;i+=2)g+=`<text x="${X(i/10)}" y="${H-10}" text-anchor="middle">${i*10}%</text>`;
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Contribution per wallet against utilisation">${g}
 <line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--faint)" stroke-dasharray="4 3"/>
 <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.4"/>
 <circle cx="${X(Math.min(cur,1.2))}" cy="${Y(calc(s,cur).contrib)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
 ${be!=null&&be<=1.2?`<circle cx="${X(be)}" cy="${Y(0)}" r="4.5" fill="var(--amber)" stroke="var(--surface)" stroke-width="2"/>`:''}
 </svg>`;
}
function draw(){
 const s=S,r=calc(s),be=breakeven(s),w=worst(s);
 $('spMode').disabled=r.unl;$('gpMode').value=s.gpMode;
 const paid=r.gross, pool=r.contrib*s.N;
 const status=r.cm>=s.target/100?['g','Meets target']:r.contrib>=0?['a','Positive, below target']:['r','Loss-making'];
 const beTxt=be==null?'none up to 300%':pc(be,1);
 const cur=(s.up+s.ud+s.uc+s.ua)/4;
 let h=`<section class="kpis">
 <div class="kpi"><span class="eyebrow">Contribution / wallet</span><span class="v ${cl(r.contrib)}">${inr(r.contrib)}</span><span class="s">${pc(r.cm)} of net price ${inr(r.net,2)}</span></div>
 <div class="kpi"><span class="eyebrow">Programme total</span><span class="v ${cl(pool)}">${big(pool)}</span><span class="s">${IN(s.N)} wallets</span></div>
 <div class="kpi"><span class="eyebrow">Break-even utilisation</span><span class="v">${beTxt}</span><span class="s">All four buckets scaled together; now ${cur.toFixed(0)}% on average</span></div>
 <div class="kpi"><span class="eyebrow">Worst case / wallet</span><span class="v ${cl(w.contrib)}">${inr(w.contrib)}</span><span class="s">${big(w.contrib*s.N)} on all wallets</span></div>
 </section>
 <section class="card"><div class="ch"><h2>Bucket-wise utilisation and total Provider cost</h2><p>Every row follows the inputs on the left. Wallet spend is value debited at list price. Virtual and speciality consults are free benefits, so they add cost but no sales.</p></div><div class="tw"><table>
 <tr><th>Bucket</th><th>Limit</th><th>Utilisation</th><th>Wallet spend</th><th>Sales value</th><th>Provider cost</th><th>Margin earned</th></tr>
 ${[['Pharma',s.lp,s.up,r.spP,r.salesP,r.costP],['Diagnostics',s.ld,s.ud,r.spD,r.salesD,r.costD],(r.unl?['Physical GP consults (unlimited)','Unlimited',s.gpUnl+' visits',r.spC,r.salesC,r.costC]:['Physical consult (GP)',s.lc,s.uc,r.spC,r.salesC,r.costC]),['AHC package',s.la,s.ua,r.spA,r.salesA,r.costA]].map(b=>`<tr><td>${b[0]}</td><td class="m">${typeof b[1]==='string'?b[1]:inr(b[1])}</td><td class="m">${b[2]}${typeof b[2]==='string'?'':'%'}</td><td class="m">${inr(b[3])}</td><td class="m">${inr(b[4])}</td><td class="m">${inr(b[5])}</td><td class="m ${cl(b[4]-b[5])}">${inr(b[4]-b[5])}</td></tr>`).join('')}
